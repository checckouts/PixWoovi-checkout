<style>

.accordion{margin-bottom:10px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#f8fafc}

/* Sticky Footer */
.sticky-footer{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid #e2e8f0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.sticky-footer-inner{max-width:480px;margin:0 auto}
.sticky-btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:900;color:#fff;background:#22c55e;cursor:pointer;box-shadow:0 4px 16px rgba(34,197,94,.3);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.sticky-btn:hover{filter:brightness(1.05)}

/* Modals */
.modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);padding:20px;animation:fadeIn .3s}
.modal-box{max-width:360px;width:100%;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;animation:slideUp .4s}

/* Delivery Modal */
.delivery-input{width:100%;border:2px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:12px 14px;font-size:14px;color:#111;outline:none;margin-bottom:10px;transition:all .2s}

/* Nudge Toast */
.nudge-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideDown .4s}
.nudge-close{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:14px}
.nudge-close:hover{color:#fff}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulse-scale{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.animate-shake{animation:shake .5s ease-in-out}
.animate-fade-in{animation:fadeIn .3s ease-out both}
.animate-slide-up{animation:slideUp .4s ease-out both}

<body>
<div id="root" class="app"></div>

<script>
// ============================================
// CHECKOUT PIX OTIMIZADO — HTML STANDALONE
// ============================================

const DEFAULT_PRICE = 89.47;
const urlParams = new URLSearchParams(window.location.search);
const subtotal = urlParams.get('subtotal') ? parseFloat(urlParams.get('subtotal')) : DEFAULT_PRICE;
const deliveryPrice = (subtotal * 1.46).toFixed(2).replace('.',',');
const pixPrice = subtotal.toFixed(2).replace('.',',');
const savings = (subtotal * 0.46).toFixed(2).replace('.',',');
const discountPct = Math.round(((subtotal * 1.46 - subtotal) / (subtotal * 1.46)) * 100);

let currentStep = 'select';
let pixCode = '';
let timerInterval = null;
let remainingSeconds = 15 * 60;
let copyCount = 0;
let socialCount = 130 + Math.floor(Math.random() * 40);
let nudgeShown = false;
let exitShown = false;

function $(sel){ return document.querySelector(sel); }
function $$(sel){ return document.querySelectorAll(sel); }

function formatTime(sec){
  const m = Math.floor(sec / 60).toString().padStart(2,'0');
  const s = (sec % 60).toString().padStart(2,'0');
  return m + ':' + s;
}

function maskCPF(v){
  return v.replace(/\D/g,'').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})/,'$1-$2').replace(/(-\d{2})\d+?$/,'$1');
}
function maskPhone(v){
  return v.replace(/\D/g,'').replace(/^(\d{2})(\d)/g,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').replace(/(-\d{4})\d+?$/,'$1');
}

function renderQR(canvas, code){
  const ctx = canvas.getContext('2d');
  const w = 200, h = 200;
  canvas.width = w; canvas.height = h;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#000';
  const size = 8, modules = 25, offset = (w - modules * size) / 2;
  for(let i=0;i<modules;i++)for(let j=0;j<modules;j++){
    const hash = (code.charCodeAt((i*modules+j)%code.length)+i*7+j*13)%3;
    if(hash!==0) ctx.fillRect(offset+j*size,offset+i*size,size,size);
  }
  function finder(x,y){ ctx.fillStyle='#000';ctx.fillRect(x,y,7*size,7*size);ctx.fillStyle='#fff';ctx.fillRect(x+size,y+size,5*size,5*size);ctx.fillStyle='#000';ctx.fillRect(x+2*size,y+2*size,3*size,3*size);}
  finder(offset,offset); finder(offset+(modules-7)*size,offset); finder(offset,offset+(modules-7)*size);
}

function startTimer(){
  remainingSeconds = 15 * 60;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remainingSeconds--;
    const pct = (remainingSeconds / (15*60)) * 100;
    const fill = $('#timer-fill');
    if(fill){
      fill.style.width = pct + '%';
      fill.className = remainingSeconds <= 120 ? 'progress-fill red' : remainingSeconds <= 300 ? 'progress-fill yellow' : 'progress-fill green';
    }
    const timerEl = $('#timer-text');
    if(timerEl){
      timerEl.textContent = formatTime(remainingSeconds);
      timerEl.className = remainingSeconds <= 120 ? 'timer-text timer-urgent' : remainingSeconds <= 300 ? 'timer-text timer-warning' : 'timer-text';
    }
    const statusEl = $('#status-text');
    const dotEl = $('#status-dot');
    const badgeEl = $('#status-badge');
    if(statusEl) statusEl.textContent = remainingSeconds <= 0 ? 'Código expirado — gere um novo' : 'Aguardando pagamento';
    if(badgeEl) badgeEl.className = 'status-badge ' + (remainingSeconds <= 120 ? 'urgent' : 'waiting');
    if(dotEl) dotEl.className = remainingSeconds <= 120 ? 'dot-pulse' : 'dot-pulse';
    if(remainingSeconds <= 120 && !nudgeShown){ showNudge(); nudgeShown = true; }
    if(remainingSeconds <= 0){ clearInterval(timerInterval); }
  }, 1000);
}

function stopTimer(){ if(timerInterval) clearInterval(timerInterval); }

function copyToClipboard(text){
  if(navigator.clipboard){ navigator.clipboard.writeText(text); return true; }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta); return ok;
}

function showCopiedFeedback(){
  const btn = $('#copy-btn');
  const sticky = $('#sticky-btn');
  if(btn){ btn.innerHTML = '✓ Código copiado!'; btn.style.background = '#16a34a'; }
  if(sticky){ sticky.innerHTML = '✓ Copiado!'; sticky.style.background = '#16a34a'; }
  setTimeout(() => {
    if(btn){ btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> ' + (copyCount > 0 ? 'Copiar código novamente' : 'Copiar código PIX'); btn.style.background = '#22c55e'; }
    if(sticky){ sticky.innerHTML = '📋 Copiar código PIX'; sticky.style.background = '#22c55e'; }
  }, 2500);
}

function handleCopy(){
  if(remainingSeconds <= 0) return;
  copyToClipboard(pixCode);
  copyCount++;
  showCopiedFeedback();
}

function showExitModal(){ if(!exitShown){ exitShown = true; $('#exit-modal').style.display = 'flex'; } }
function hideExitModal(){ $('#exit-modal').style.display = 'none'; }
function showNudge(){ $('#nudge-toast').style.display = 'flex'; }
function hideNudge(){ $('#nudge-toast').style.display = 'none'; }

// Inactivity tracking
let inactivityTimer;
function resetInactivity(){
  clearTimeout(inactivityTimer);
  if(remainingSeconds > 0 && currentStep === 'pix-payment' && !nudgeShown){
    inactivityTimer = setTimeout(() => { if(!nudgeShown){ showNudge(); nudgeShown = true; } }, 90000);
  }
}
['mousemove','touchstart','scroll','keydown'].forEach(e => document.addEventListener(e, resetInactivity, {passive:true}));

// Tab urgency
let originalTitle = document.title;
document.addEventListener('visibilitychange', () => {
  if(document.hidden && currentStep === 'pix-payment' && remainingSeconds > 0){
    document.title = '⏰ PIX expira em ' + formatTime(remainingSeconds) + ' - Pague agora!';
  } else {
    document.title = originalTitle;
  }
});

// Social proof
setInterval(() => { if(Math.random() < .35) { socialCount++; const el = $('#social-count'); if(el) el.textContent = socialCount + ' pessoas pagaram nas últimas 24h'; } }, 18000);

// Exit intent
document.addEventListener('mouseleave', (e) => { if(e.clientY <= 0 && currentStep === 'pix-payment' && remainingSeconds > 0) showExitModal(); });

function validateForm(){
  const name = $('#input-name').value.trim();
  const cpf = $('#input-cpf').value.replace(/\D/g,'');
  const phone = $('#input-phone').value.replace(/\D/g,'');
  const nameValid = name.split(/\s+/).length >= 2 && name.length >= 5;
  const cpfValid = cpf.length === 11;
  const phoneValid = phone.length === 11;
  $('#check-name').style.display = nameValid ? 'block' : 'none';
  $('#check-cpf').style.display = cpfValid ? 'block' : 'none';
  $('#check-phone').style.display = phoneValid ? 'block' : 'none';
  const btn = $('#submit-btn');
  if(nameValid && cpfValid && phoneValid){
    btn.disabled = false;
    btn.classList.add('active');
  } else {
    btn.disabled = true;
    btn.classList.remove('active');
  }
}

function submitForm(e){
  e.preventDefault();
  const name = $('#input-name').value.trim();
  const cpf = $('#input-cpf').value.replace(/\D/g,'');
  const phone = $('#input-phone').value.replace(/\D/g,'');
  const err = $('#form-error');
  const errText = $('#error-text');
  if(name.split(/\s+/).length < 2 || name.length < 5){ err.style.display='flex'; errText.textContent='Informe seu nome completo.'; err.classList.remove('animate-shake'); void err.offsetWidth; err.classList.add('animate-shake'); return; }
  if(cpf.length !== 11){ err.style.display='flex'; errText.textContent='Informe um CPF válido.'; err.classList.remove('animate-shake'); void err.offsetWidth; err.classList.add('animate-shake'); return; }
  if(phone.length !== 11){ err.style.display='flex'; errText.textContent='Informe um telefone válido.'; err.classList.remove('animate-shake'); void err.offsetWidth; err.classList.add('animate-shake'); return; }
  err.style.display = 'none';
  goToPayment(name, cpf, phone);
}

function toggleAccordion(btn){
  const body = btn.nextElementSibling;
  const arrow = btn.querySelector('.accordion-arrow');
  if(body.style.display === 'none'){ body.style.display = 'block'; arrow.classList.add('open'); }
  else { body.style.display = 'none'; arrow.classList.remove('open'); }
}

function goToSelect(){ currentStep = 'select'; stopTimer(); renderSelect(); }
function goToForm(){ currentStep = 'pix-form'; renderForm(); }
